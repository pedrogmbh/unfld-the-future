name: Purge Bunny CDN cache

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Purge cache
        run: |
          curl --fail-with-body -sS -X POST \
            "https://api.bunny.net/pullzone/${{ vars.BUNNY_PULL_ZONE_ID }}/purgeCache" \
            -H "AccessKey: ${{ secrets.BUNNYCDN_API_KEY }}"
