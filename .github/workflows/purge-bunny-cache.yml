name: Purge Bunny CDN cache

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SITE: www.unfld.com.br
  PUSHOVER_URL: https://api.pushover.net/1/messages.json

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for Vercel to finish deploying
        run: sleep 20
      - name: Configure CDN handling for canonical redirects
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNYCDN_API_KEY }}
          BUNNY_ZONE_ID: ${{ vars.BUNNY_PULL_ZONE_ID }}
        run: |
          set -euo pipefail
          zone_url="https://api.bunny.net/pullzone/$BUNNY_ZONE_ID"
          # CDN-Host redirects must not share cached responses with the canonical host.
          curl --fail-with-body -sS "$zone_url" \
            -H "AccessKey: $BUNNY_API_KEY" -o zone.json
          if ! jq -e '.EnableHostnameVary == true' zone.json > /dev/null; then
            curl --fail-with-body -sS -X POST "$zone_url" \
              -H "AccessKey: $BUNNY_API_KEY" \
              -H 'Content-Type: application/json' \
              --data '{"EnableHostnameVary":true}' -o /dev/null
          fi
          curl --fail-with-body -sS "$zone_url" \
            -H "AccessKey: $BUNNY_API_KEY" -o zone.json
          jq -e '.EnableHostnameVary == true' zone.json
          # Optimizer prerender must not turn an origin 301 into a rendered 200.
          # Match only the aliases declared in vercel.json; preserve all other rules.
          rule_name='UNFLD redirect aliases bypass Optimizer'
          jq --arg description "$rule_name" \
            --arg guid "$(cat /proc/sys/kernel/random/uuid)" \
            --slurpfile config vercel.json '
            (.EdgeRules // [] | map(select(.Description == $description)) | first) as $existing |
            {
              Guid: ($existing.Guid // $guid),
              ActionType: 12,
              ActionParameter1: "",
              ActionParameter2: "",
              Triggers: [{
                Type: 0,
                PatternMatchingType: 0,
                PatternMatches: ([$config[0].redirects[].has[] |
                  select(.type == "header" and .key == "cdn-host") |
                  .value.inc[]] | unique | map("*://" + . + "/*"))
              }],
              TriggerMatchingType: 0,
              Description: $description,
              Enabled: true,
              OrderIndex: ($existing.OrderIndex // 0)
            }' zone.json > alias-optimizer-rule.json
          curl --fail-with-body -sS -X POST "$zone_url/edgerules/addOrUpdate" \
            -H "AccessKey: $BUNNY_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary @alias-optimizer-rule.json -o /dev/null
          curl --fail-with-body -sS "$zone_url" \
            -H "AccessKey: $BUNNY_API_KEY" -o zone.json
          jq -e --arg description "$rule_name" \
            'any(.EdgeRules[]; .Description == $description and .ActionType == 12 and .Enabled == true)' zone.json
      - name: Purge cache
        id: purge
        run: |
          curl -v --fail-with-body -sS -X POST \
            "https://api.bunny.net/pullzone/${{ vars.BUNNY_PULL_ZONE_ID }}/purgeCache" \
            -H "AccessKey: ${{ secrets.BUNNYCDN_API_KEY }}"

      - name: Purge alternate hostname cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNYCDN_API_KEY }}
        run: |
          set -euo pipefail
          jq -r '[.redirects[].has[] | select(.type == "header" and .key == "cdn-host") | .value.inc[]] | unique[]' vercel.json |
          while IFS= read -r hostname; do
            curl --fail-with-body -sS -X POST --get \
              'https://api.bunny.net/purge' \
              --data-urlencode "url=https://$hostname/" \
              --data-urlencode 'async=false' \
              --data-urlencode 'exactPath=false' \
              -H "AccessKey: $BUNNY_API_KEY"
          done

      - name: Purge localized social previews
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNYCDN_API_KEY }}
        run: |
          set -euo pipefail
          # Exact URL purges also invalidate stale Optimizer prerender snapshots.
          for language in '' en en-US pt pt-BR es es-AR fr fr-FR; do
            for path in / /telemedicina /blog/hive-mind; do
              preview_url="https://$SITE$path"
              if [ -n "$language" ]; then
                preview_url="$preview_url?hl=$language"
              fi
              curl --fail-with-body -sS -X POST --get \
                'https://api.bunny.net/purge' \
                --data-urlencode "url=$preview_url" \
                --data-urlencode 'async=false' \
                --data-urlencode 'exactPath=true' \
                -H "AccessKey: $BUNNY_API_KEY"
            done
          done

      - name: Wait for BunnyCDN purge take effect
        run: sleep 10

      - name: Check is-agentic score
        id: agentic
        env:
          PUSHOVER_API_KEY: ${{ secrets.PUSHOVER_API_KEY }}
          PUSHOVER_GROUP_KEY: ${{ secrets.PUSHOVER_GROUP_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          # Capture the output whether the tool exits clean or not.
          npx -y is-agentic "$SITE" > raw.txt 2>&1 || true

          # Strip ANSI colour so the text is readable in a notification.
          perl -pe 's/\e\[[0-9;]*[a-zA-Z]//g' raw.txt > report.txt
          cat report.txt

          if grep -qE '100[[:space:]]*/[[:space:]]*100' report.txt; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "is-agentic reported 100 / 100 - no report sent"
            exit 0
          fi

          echo "passed=false" >> "$GITHUB_OUTPUT"
          echo "::warning::is-agentic did not report 100 / 100 for $SITE"

          # Full report goes to the run log and the job summary.
          {
            echo "### is-agentic — $SITE"
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Pushover caps a message at 1024 chars and the report is several KB,
          # so send the head of it plus a link to the full output.
          preview=$(grep -v '^npm notice' report.txt \
            | awk 'len + length($0) + 1 > 820 { exit } { print; len += length($0) + 1 }')
          message=$(printf '%s\n\n[full report in the run log]' "$preview")

          curl -v --fail-with-body -sS -X POST "$PUSHOVER_URL" \
            --form-string "token=$PUSHOVER_API_KEY" \
            --form-string "user=$PUSHOVER_GROUP_KEY" \
            --form-string "title=UNFLD Site - Is Agentic Report" \
            --form-string "message=$message" \
            --form-string "url=$RUN_URL" \
            --form-string "url_title=View full report"

      - name: Notify Pushover
        if: always()
        env:
          PUSHOVER_API_KEY: ${{ secrets.PUSHOVER_API_KEY }}
          PUSHOVER_GROUP_KEY: ${{ secrets.PUSHOVER_GROUP_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          PURGE: ${{ steps.purge.outcome }}
          AGENTIC: ${{ steps.agentic.outcome }}
          PASSED: ${{ steps.agentic.outputs.passed }}
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            title="UNFLD - Bunny cache purged"
            priority=-1
          else
            title="UNFLD - Purge workflow $JOB_STATUS"
            priority=1
          fi

          message=$(printf 'purge: %s\nis-agentic: %s (100/100: %s)\ncommit: %s on %s' \
            "$PURGE" "${AGENTIC:-skipped}" "${PASSED:-n/a}" "${GITHUB_SHA:0:7}" "$GITHUB_REF_NAME")

          curl -v --fail-with-body -sS -X POST "$PUSHOVER_URL" \
            --form-string "token=$PUSHOVER_API_KEY" \
            --form-string "user=$PUSHOVER_GROUP_KEY" \
            --form-string "title=$title" \
            --form-string "message=$message" \
            --form-string "priority=$priority" \
            --form-string "url=$RUN_URL" \
            --form-string "url_title=View run"
